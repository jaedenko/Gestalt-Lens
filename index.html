<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestalt Lens</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #222;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 8px;
        }

        .subtitle {
            color: #666;
            font-size: 17px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .upload {
            border: 2px dashed #bbb;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload:hover {
            border-color: #555;
            background: #fafafa;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 18px;
            font-weight: bold;
        }

        .upload-small {
            color: #777;
            margin-top: 8px;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        #preview {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #ddd;
            border-top-color: #222;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result {
            display: none;
        }

        .label {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
            font-weight: bold;
            color: #888;
        }

        .principle {
            font-size: 36px;
            font-weight: bold;
            margin: 8px 0 20px;
        }

        .reason {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .confidence-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .bar {
            height: 12px;
            background: #e5e5e5;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #222;
            transition: width 0.5s ease;
        }

        .other {
            margin-top: 25px;
        }

        .tag {
            display: inline-block;
            background: #eee;
            border-radius: 20px;
            padding: 8px 14px;
            margin: 5px 5px 0 0;
            font-size: 14px;
        }

        .error {
            display: none;
            background: #ffe5e5;
            color: #9b0000;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Gestalt Lens</h1>
        <div class="subtitle">
            Upload an image and discover the Gestalt principle it demonstrates.
        </div>
    </header>

    <div class="card">

        <label class="upload" for="fileInput">
            <div class="upload-icon">📷</div>

            <div class="upload-text">
                Click to upload a photo
            </div>

            <div class="upload-small">
                JPG, PNG, WEBP, or other common image formats
            </div>
        </label>

        <input
            id="fileInput"
            type="file"
            accept="image/*"
        >

        <img id="preview" alt="Selected image">

        <button id="analyzeButton" disabled>
            Analyze Photo
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <strong>Analyzing your image...</strong>
            <div class="upload-small">
                Gestalt Lens is looking for the strongest visual principle.
            </div>
        </div>

        <div class="error" id="error"></div>

    </div>

    <div class="card result" id="result">

        <div class="label">
            Primary Gestalt Principle
        </div>

        <div class="principle" id="principle">
            —
        </div>

        <div class="label">
            Why?
        </div>

        <div class="reason" id="reason">
            —
        </div>

        <div class="confidence-row">
            <span>Confidence</span>
            <span id="confidence">0%</span>
        </div>

        <div class="bar">
            <div class="bar-fill" id="barFill"></div>
        </div>

        <div class="other">
            <div class="label">
                Other possibilities
            </div>

            <div id="otherTags"></div>
        </div>

    </div>

</div>


<script>

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const analyzeButton = document.getElementById("analyzeButton");

const loading = document.getElementById("loading");
const result = document.getElementById("result");
const errorBox = document.getElementById("error");

const principle = document.getElementById("principle");
const reason = document.getElementById("reason");
const confidence = document.getElementById("confidence");
const barFill = document.getElementById("barFill");
const otherTags = document.getElementById("otherTags");


fileInput.addEventListener("change", () => {

    const file = fileInput.files[0];

    if (!file) {
        return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    analyzeButton.disabled = false;

    result.style.display = "none";
    errorBox.style.display = "none";
});


analyzeButton.addEventListener("click", async () => {

    const file = fileInput.files[0];

    if (!file) {
        return;
    }

    analyzeButton.disabled = true;
    loading.style.display = "block";
    result.style.display = "none";
    errorBox.style.display = "none";

    const formData = new FormData();

    formData.append("image", file);

    try {

        const response = await fetch("/analyze", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong.");
        }

        principle.textContent = data.principle;
        reason.textContent = data.reason;

        confidence.textContent = data.confidence + "%";
        barFill.style.width = data.confidence + "%";

        otherTags.innerHTML = "";

        if (data.other && data.other.length > 0) {

            data.other.forEach(item => {

                const tag = document.createElement("span");

                tag.className = "tag";
                tag.textContent = item;

                otherTags.appendChild(tag);
            });

        } else {

            otherTags.textContent = "None";

        }

        result.style.display = "block";

    } catch (error) {

        errorBox.textContent = "Error: " + error.message;
        errorBox.style.display = "block";

    } finally {

        loading.style.display = "none";
        analyzeButton.disabled = false;

    }

});

</script>

</body>
</html>
